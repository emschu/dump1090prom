global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dump1090prom'
    static_configs:
      - targets: ['host.containers.internal:8080']
    metrics_path: /metrics
    scrape_interval: 1s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']